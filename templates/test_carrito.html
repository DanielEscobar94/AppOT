<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Carrito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
    <div class="container py-5">
        <h2>Prueba de Carrito de Productos</h2>
        
        <div class="card mt-3">
            <div class="card-header">
                <h5>Productos/Servicios</h5>
            </div>
            <div class="card-body">
                <div class="row g-2 mb-3">
                    <div class="col-md-3 position-relative">
                        <input type="text" class="form-control form-control-sm" id="producto-sku" placeholder="Buscar producto..." autocomplete="off">
                        <div id="productos-sugerencias" class="position-absolute bg-white border rounded shadow-sm" style="display: none; z-index: 1000; max-height: 200px; overflow-y: auto; width: 100%;"></div>
                    </div>
                    <div class="col-md-2">
                        <input type="number" class="form-control form-control-sm" id="producto-cantidad" placeholder="Cant." min="1" value="1">
                    </div>
                    <div class="col-md-2">
                        <input type="number" class="form-control form-control-sm" id="producto-descuento" placeholder="Desc. %" min="0" max="100" value="0">
                    </div>
                    <div class="col-md-2">
                        <input type="number" class="form-control form-control-sm" id="producto-precio" placeholder="Precio $" min="0" step="1">
                    </div>
                    <div class="col-md-3">
                        <button type="button" class="btn btn-success btn-sm w-100" id="btn-agregar-al-carrito">
                            <i class="bi bi-cart-plus"></i> Agregar
                        </button>
                    </div>
                </div>
                
                <div id="productos-articulo-lista" class="mb-2 border-top pt-2">
                    <div class="text-muted small text-center py-2"><i class="bi bi-cart-x"></i> No hay productos agregados</div>
                </div>
                
                <div class="text-end">
                    <strong>Total: $<span id="productos-articulo-total">0</span></strong>
                </div>
            </div>
        </div>
        
        <div class="alert alert-info mt-3">
            <strong>Instrucciones:</strong>
            <ol>
                <li>Escribe en el campo de búsqueda: "bateria" o "correa"</li>
                <li>Selecciona un producto de la lista</li>
                <li>Ajusta cantidad y descuento si quieres</li>
                <li>Haz clic en "Agregar"</li>
            </ol>
        </div>
    </div>
    
    <!-- Campo oculto para compatibilidad -->
    <input type="hidden" id="valor-articulo">
    
    <!-- Modal placeholder (no se usa en esta prueba) -->
    <div id="modalArticulo"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/orden_trabajo_carrito.js"></script>
    
    <script>
        // Abrir consola del navegador (F12) para ver los logs
        console.log('🧪 Página de prueba cargada');
        console.log('👉 Abre la consola del navegador (F12) para ver los logs del carrito');
    </script>
</body>
</html>
