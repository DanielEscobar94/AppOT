{% extends 'base.html' %}

{% block page_title %}Error {{ code or '' }}{% endblock %}

{% block content %}
<div class="container-fluid p-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-5 text-center">
          <i class="bi bi-exclamation-triangle text-warning" style="font-size:3rem;"></i>
          <h1 class="h3 fw-bold mt-3">{{ code or 'Error' }}</h1>
          <p class="text-secondary">{{ message or 'Ocurrió un error inesperado.' }}</p>
          <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary mt-2">
            <i class="bi bi-house me-1"></i>Volver al inicio
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
